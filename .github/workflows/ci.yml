name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node binding and corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # .npmrc sets ignore-scripts=true; the native builds need scripts enabled
      - run: pnpm install --frozen-lockfile --ignore-scripts=false
      - run: pnpm generate
      - name: Generated files are up to date
        run: git diff --exit-code src
      - run: pnpm test

  rust:
    name: Rust binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  c:
    name: C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts=false
      - name: Build with make
        run: make TS=$PWD/node_modules/.bin/tree-sitter
      - name: Build and test with CMake
        run: |
          cmake -S . -B build -DTREE_SITTER_CLI=$PWD/node_modules/.bin/tree-sitter
          cmake --build build --target ts-test

  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[core]"
      # Runs from the repo root; the package lives under bindings/python, so the installed copy is imported.
      - run: python -m unittest discover -s bindings/python/tests
